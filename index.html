<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Revisão de Contrato de Veículo | Reduza suas parcelas</title>

  <meta
    name="description"
    content="Saiba como reduzir suas parcelas de financiamento de veículo com revisão contratual especializada. Proteja seu patrimônio e evite juros abusivos."
  />

  <!-- Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=JetBrains+Mono:wght@400&family=Raleway:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --primary: #2D2D2D;
      --secondary: #6F563E;
      --background: #F5F0EB;
      --white: #FFFFFF;

      --text: #2D2D2D;
      --text-light: #625C56;
      --border: #DED6CE;

      --display-font: "Cormorant Garamond", serif;
      --heading-font: "Cormorant Garamond", serif;
      --body-font: "Raleway", sans-serif;
      --mono-font: "JetBrains Mono", monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--body-font);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--text);
      background: var(--background);
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      padding: 90px 0;
    }

    /* =========================
       TIPOGRAFIA
    ========================= */

    h1,
    h2,
    h3,
    .section-title,
    .about-content h2,
    .form-info h2,
    .form-box h3,
    .final-cta h2 {
      font-family: var(--heading-font);
      color: var(--primary);
      font-weight: 700;
    }

    .hero h1 {
      font-family: var(--display-font);
      font-size: 56px;
      font-weight: 900;
      line-height: 1.03;
      color: var(--white);
      margin-bottom: 26px;
    }

    .section-title {
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 20px;
      text-align: center;
    }

    .section-subtitle {
      max-width: 850px;
      margin: 0 auto 50px;
      text-align: center;
      color: var(--text-light);
      font-family: var(--body-font);
      font-size: 20px;
      font-weight: 500;
    }

    .hero p {
      color: rgba(255, 255, 255, 0.92);
      font-size: 20px;
      font-weight: 500;
      max-width: 700px;
      margin-bottom: 34px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;

      background:
        linear-gradient(
          rgba(45, 45, 45, 0.82),
          rgba(45, 45, 45, 0.88)
        ),
        url("./contract-banner.jpg") center center / cover no-repeat;

      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      background: rgba(111, 86, 62, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);

      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;

      font-family: var(--body-font);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;

      margin-bottom: 28px;
    }

    .hero-card {
      background: rgba(45, 45, 45, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 30px;

      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .hero-card h3 {
      color: white;
      font-size: 28px;
      margin-bottom: 18px;
    }

    .hero-card ul {
      list-style: none;
    }

    .hero-card li {
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .hero-card li::before {
      content: "✓";
      color: #C9AA87;
      font-weight: 700;
    }

    /* =========================
       BOTÕES
    ========================= */

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      background: var(--secondary);
      color: white;

      padding: 17px 32px;
      border-radius: 8px;

      font-family: var(--body-font);
      font-size: 16px;
      font-weight: 700;

      border: 1px solid var(--secondary);
      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .cta-btn:hover {
      background: #5E4936;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(111, 86, 62, 0.25);
    }

    /* =========================
       BENEFÍCIOS
    ========================= */

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 40px;
    }

    .benefit-card {
      background: var(--white);
      border-radius: 18px;
      padding: 28px;

      border: 1px solid var(--border);

      box-shadow: 0 10px 28px rgba(45, 45, 45, 0.05);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .benefit-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(45, 45, 45, 0.09);
    }

    .benefit-icon {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: var(--secondary);
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 700;

      margin-bottom: 18px;
    }

    .benefit-card p {
      font-family: var(--body-font);
      font-size: 16px;
      color: var(--text);
    }

    /* =========================
       FORMULÁRIO
    ========================= */

    .form-section {
      background: var(--primary);
    }

    .form-wrapper {
      background: white;
      border-radius: 24px;
      overflow: hidden;

      display: grid;
      grid-template-columns: 1fr 1fr;

      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
    }

    .form-info {
      padding: 60px;

      background:
        linear-gradient(
          rgba(45, 45, 45, 0.84),
          rgba(45, 45, 45, 0.9)
        ),
        url("./contract-banner.jpg") center center / cover no-repeat;

      color: white;
    }

    .form-info h2 {
      font-size: 42px;
      line-height: 1.12;
      color: white;
      margin-bottom: 24px;
    }

    .form-info p {
      color: rgba(255, 255, 255, 0.86);
      font-size: 18px;
    }

    .form-box {
      padding: 60px;
      background: white;
    }

    .form-box h3 {
      font-size: 32px;
      margin-bottom: 28px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    label {
      font-family: var(--body-font);
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      display: block;
    }

    input,
    select {
      width: 100%;
      padding: 15px;

      border-radius: 8px;
      border: 1px solid var(--border);

      font-family: var(--body-font);
      font-size: 16px;

      outline: none;
      background: white;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(111, 86, 62, 0.1);
    }

    .submit-btn {
      background: var(--secondary);
      color: white;

      border: none;
      padding: 17px;

      border-radius: 8px;

      font-family: var(--body-font);
      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #5E4936;
      transform: translateY(-2px);
    }

    /* =========================
       EDUCATIVA
    ========================= */

    .educational {
      background: var(--background);
    }

    .educational-box {
      background: white;
      border-radius: 20px;
      padding: 60px;
      border: 1px solid var(--border);
    }

    .educational-box .section-title {
      color: var(--primary);
    }

    .educational p {
      margin-bottom: 18px;
      color: var(--text-light);
      font-size: 16px;
    }

    /* =========================
       FAQ
    ========================= */

    .faq-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 900px;
      margin: 0 auto;
    }

    details {
      background: white;
      border-radius: 12px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(45, 45, 45, 0.04);
    }

    summary {
      cursor: pointer;
      font-family: var(--heading-font);
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }

    details p {
      margin-top: 16px;
      color: var(--text-light);
      font-size: 16px;
    }

    /* =========================
       SOBRE
    ========================= */

    .about-section {
      background: var(--primary);
      color: white;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 60px;
      align-items: center;
    }

    .about-image img {
      width: 100%;
      border-radius: 20px;
      object-fit: cover;

      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);

      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .about-content h2 {
      font-size: 42px;
      color: white;
      margin-bottom: 26px;
    }

    .about-content p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 18px;
      font-size: 16px;
    }

    /* =========================
       REDES SOCIAIS
    ========================= */

    .social-section {
      text-align: center;
      background: var(--background);
    }

    .social-links {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .social-links a {
      background: white;
      padding: 16px 24px;
      border-radius: 10px;

      color: var(--primary);

      font-weight: 600;

      border: 1px solid var(--border);

      box-shadow: 0 8px 20px rgba(45, 45, 45, 0.05);

      transition: 0.2s ease;
    }

    .social-links a:hover {
      color: var(--secondary);
      transform: translateY(-2px);
    }

    /* =========================
       CTA FINAL
    ========================= */

    .final-cta {
      background:
        linear-gradient(
          rgba(45, 45, 45, 0.88),
          rgba(45, 45, 45, 0.92)
        ),
        url("./contract-banner.jpg") center center / cover no-repeat;

      text-align: center;
      color: white;
    }

    .final-cta h2 {
      font-family: var(--display-font);
      font-size: 48px;
      font-weight: 900;
      max-width: 900px;
      margin: 0 auto 28px;
      line-height: 1.12;
      color: white;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #1C1C1C;
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      padding: 28px 20px;
      font-family: var(--body-font);
      font-size: 12px;
    }

    /* =========================
       MONO / CAPTION
    ========================= */

    .caption,
    code {
      font-family: var(--mono-font);
      font-size: 12px;
      font-weight: 400;
    }

    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp-float {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 999;

      width: 64px;
      height: 64px;

      border-radius: 50%;

      background: var(--secondary);

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 14px 30px rgba(45, 45, 45, 0.25);

      transition: 0.2s ease;
    }

    .whatsapp-float:hover {
      transform: scale(1.06);
      background: #5E4936;
    }

    .whatsapp-float svg {
      width: 32px;
      fill: white;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 992px) {

      .hero-grid,
      .form-wrapper,
      .about-grid,
      .benefits-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: auto;
        padding: 100px 0;
      }

      .hero h1 {
        font-size: 48px;
      }

      .form-info,
      .form-box {
        padding: 40px;
      }

      section {
        padding: 70px 0;
      }
    }

    @media (max-width: 640px) {

      .container {
        padding: 0 18px;
      }

      .hero {
        padding: 80px 0;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero p {
        font-size: 18px;
      }

      .section-title {
        font-size: 32px;
      }

      .form-info h2,
      .about-content h2 {
        font-size: 34px;
      }

      .final-cta h2 {
        font-size: 38px;
      }

      .form-box h3 {
        font-size: 30px;
      }

      .benefit-card,
      details,
      .educational-box {
        padding: 22px;
      }

      .whatsapp-float {
        width: 58px;
        height: 58px;
        right: 18px;
        bottom: 18px;
      }

      .whatsapp-float svg {
        width: 29px;
      }
    }
  </style>
</head>
